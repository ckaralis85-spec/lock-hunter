name: Build Windows EXE

# Builds a standalone LockHunter.exe in public CI so anyone can verify the
# binary is produced from the source in this repo. Runs on every tagged
# release (e.g. push a tag like v4.7.0), and can also be run by hand from the
# Actions tab. On a release it attaches the .exe to that release automatically.

on:
  release:
    types: [published]
  workflow_dispatch: {}      # allow manual runs from the Actions tab

permissions:
  contents: write            # needed to upload the .exe to the Release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out the source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build the standalone exe
        run: >
          pyinstaller --noconfirm --onefile --windowed
          --name LockHunter
          --icon assets/lpu_icon.ico
          --add-data "assets;assets"
          lock_hunter.py

      - name: Upload the exe as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: LockHunter-exe
          path: dist/LockHunter.exe

      - name: Attach the exe to the Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/LockHunter.exe
